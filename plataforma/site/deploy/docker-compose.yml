name: dyno-site

services:
  dyno-site:
    image: nginx:1.27-alpine
    container_name: dyno-site
    restart: unless-stopped
    environment:
      SITE_SECRET: ${SITE_SECRET}
      BUNDLE_URL: https://xvekgnbneeokihtjpbts.supabase.co/rest/v1/rpc/dyno_site_bundle
      BUNDLE_KEY: ${BUNDLE_KEY}
      NGINX_ENVSUBST_FILTER: SITE_
      TZ: America/Sao_Paulo
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /site
        if wget -q -T 20 -O /tmp/b.txt --header "apikey: $${BUNDLE_KEY}" --header "Accept: text/plain" "$${BUNDLE_URL}"; then
          tr -d '"\n' < /tmp/b.txt | base64 -d > /tmp/b.tgz && rm -rf /tmp/x && mkdir -p /tmp/x && tar -xzf /tmp/b.tgz -C /tmp/x && rm -rf /site/www /site/templates && cp -r /tmp/x/* /site/ && echo "bundle atualizado"
        else
          echo "falha ao baixar o bundle; usando a copia local"
        fi
        cp -r /site/www/. /usr/share/nginx/html/
        mkdir -p /etc/nginx/templates && cp /site/templates/default.conf.template /etc/nginx/templates/default.conf.template
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - dyno_site_data:/site
    networks:
      - n8n_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n_default
      traefik.http.routers.dynosite.rule: Host(`dynoapp.com.br`) || Host(`www.dynoapp.com.br`)
      traefik.http.routers.dynosite.entrypoints: websecure
      traefik.http.routers.dynosite.tls: "true"
      traefik.http.routers.dynosite.tls.certresolver: mytlschallenge
      traefik.http.services.dynosite.loadbalancer.server.port: "80"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  dyno_site_data:
    name: dyno_site_data

networks:
  n8n_default:
    external: true
