<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.8" data-width="1080" data-height="1920">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="4.6" data-track-index="0"></div>
      <div id="el-02-painel" class="scene" data-composition-id="02-painel" data-composition-src="compositions/frames/02-painel.html" data-start="4.3" data-duration="6.0" data-track-index="1"></div>
      <div id="el-03-conversa" class="scene" data-composition-id="03-conversa" data-composition-src="compositions/frames/03-conversa.html" data-start="10.0" data-duration="7.0" data-track-index="0"></div>
      <div id="el-04-beneficios" class="scene" data-composition-id="04-beneficios" data-composition-src="compositions/frames/04-beneficios.html" data-start="16.7" data-duration="4.8" data-track-index="1"></div>
      <div id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="21.2" data-duration="4.6" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="25.8" data-track-index="11" data-volume="0.75"></audio>
      <audio id="el-sfx" src="assets/sfx/sfx-mix.wav" data-start="0" data-duration="25.8" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#el-02-painel", { clipPath: "circle(0% at 50% 60%)" }, { clipPath: "circle(80% at 50% 60%)", duration: 0.45, ease: "power3.inOut" }, 4.3);
        tl.fromTo("#el-03-conversa", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 10.0);
        tl.to("#el-02-painel", { x: -160, duration: 0.4, ease: "power3.inOut" }, 10.0);
        tl.fromTo("#el-04-beneficios", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 16.7);
        tl.to("#el-03-conversa", { y: -180, duration: 0.4, ease: "power3.inOut" }, 16.7);
        tl.fromTo("#el-05-cta", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.45, ease: "power3.inOut" }, 21.2);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
