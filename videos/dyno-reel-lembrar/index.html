<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.6" data-width="1080" data-height="1920">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="4.4" data-track-index="0"></div>
      <div id="el-02-pede" class="scene" data-composition-id="02-pede" data-composition-src="compositions/frames/02-pede.html" data-start="4.1" data-duration="6.0" data-track-index="1"></div>
      <div id="el-03-relogio" class="scene" data-composition-id="03-relogio" data-composition-src="compositions/frames/03-relogio.html" data-start="9.8" data-duration="3.0" data-track-index="0"></div>
      <div id="el-04-recebe" class="scene" data-composition-id="04-recebe" data-composition-src="compositions/frames/04-recebe.html" data-start="12.5" data-duration="6.4" data-track-index="1"></div>
      <div id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="18.6" data-duration="5.0" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="23.6" data-track-index="11" data-volume="0.75"></audio>
      <audio id="el-sfx" src="assets/sfx/sfx-mix.wav" data-start="0" data-duration="23.6" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#el-02-pede", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 4.1);
        tl.fromTo("#el-03-relogio", { clipPath: "circle(0% at 50% 40%)" }, { clipPath: "circle(80% at 50% 40%)", duration: 0.45, ease: "power3.inOut" }, 9.8);
        tl.fromTo("#el-04-recebe", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 12.5);
        tl.fromTo("#el-05-cta", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.45, ease: "power3.inOut" }, 18.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
