<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44.8" data-width="1080" data-height="1920">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0.0" data-duration="4.4" data-track-index="0"></div>
      <div id="el-02-euquero" class="scene" data-composition-id="02-euquero" data-composition-src="compositions/frames/02-euquero.html" data-start="4.1" data-duration="6.6" data-track-index="1"></div>
      <div id="el-03-grupo" class="scene" data-composition-id="03-grupo" data-composition-src="compositions/frames/03-grupo.html" data-start="10.4" data-duration="7.4" data-track-index="0"></div>
      <div id="el-04-adiciona" class="scene" data-composition-id="04-adiciona" data-composition-src="compositions/frames/04-adiciona.html" data-start="17.5" data-duration="7.0" data-track-index="1"></div>
      <div id="el-05-oi" class="scene" data-composition-id="05-oi" data-composition-src="compositions/frames/05-oi.html" data-start="24.2" data-duration="8.0" data-track-index="0"></div>
      <div id="el-06-uso" class="scene" data-composition-id="06-uso" data-composition-src="compositions/frames/06-uso.html" data-start="31.9" data-duration="7.6" data-track-index="1"></div>
      <div id="el-07-resumo" class="scene" data-composition-id="07-resumo" data-composition-src="compositions/frames/07-resumo.html" data-start="39.2" data-duration="5.6" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="44.8" data-track-index="11" data-volume="0.75"></audio>
      <audio id="el-sfx" src="assets/sfx/sfx-mix.wav" data-start="0" data-duration="44.8" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#el-02-euquero", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 4.1);
        tl.fromTo("#el-03-grupo", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 10.4);
        tl.fromTo("#el-04-adiciona", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.4, ease: "power3.inOut" }, 17.5);
        tl.fromTo("#el-05-oi", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 24.2);
        tl.fromTo("#el-06-uso", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 31.9);
        tl.fromTo("#el-07-resumo", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.4, ease: "power3.inOut" }, 39.2);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
