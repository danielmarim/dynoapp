<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-moda-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-moda-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1B1F3B; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1B1F3B; font-family: "Space Grotesk", sans-serif; color: #FFF6EA; }
      .bg { position: absolute; inset: 0; background: #1B1F3B; }
      .dots { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(255,246,234,.08) 2px, transparent 2.5px); background-size: 54px 54px; }
      .line { position: absolute; left: 96px; font-family: "Bodoni Moda", serif; font-weight: 700; font-size: 104px; line-height: 1.08; white-space: nowrap; }
      .l3 { font-style: italic; color: #FF8A3D; }
      .sub { position: absolute; left: 96px; width: 760px; top: 700px; font-size: 46px; line-height: 1.35; color: #E9E2D6; }
      .tease { position: absolute; left: 96px; top: 880px; display: flex; align-items: center; gap: 28px; }
      .typing { display: flex; gap: 14px; padding: 34px 40px; background: #14B37D; border-radius: 48px 48px 48px 10px; }
      .d { width: 24px; height: 24px; border-radius: 12px; background: #1B1F3B; }
      .t1 { font-size: 56px; font-weight: 700; }
      .t2 { font-size: 40px; font-weight: 700; color: #5FE0B0; margin-top: 4px; }
      .vagas { position: absolute; left: 96px; top: 1500px; font-size: 32px; font-weight: 700; letter-spacing: 4px; color: #E9E2D6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="bg" class="clip bg" data-start="0" data-duration="9" data-track-index="0"><div class="dots"></div></div>
      <div id="l1" data-layout-allow-overlap class="clip line" style="top: 260px" data-start="0" data-duration="9" data-track-index="1">Sem planilha.</div>
      <div id="l2" data-layout-allow-overlap class="clip line" style="top: 384px" data-start="0" data-duration="9" data-track-index="2">Sem app novo.</div>
      <div id="l3" data-layout-allow-overlap class="clip line l3" style="top: 508px" data-start="0" data-duration="9" data-track-index="3">Sem esquecer.</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="9" data-track-index="4">No lugar onde você já conversa todo dia.</div>
      <div id="tease" class="clip tease" data-start="0" data-duration="9" data-track-index="5">
        <div class="typing"><div class="d"></div><div class="d"></div><div class="d"></div></div>
        <div><div id="t1" class="t1">Algo está chegando.</div><div id="t2" class="t2">Em 60 dias.</div></div>
      </div>
      <div id="vagas" class="clip vagas" data-start="0" data-duration="9" data-track-index="6">VAGAS LIMITADAS NA ABERTURA</div>
      <audio id="bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="9" data-track-index="7" data-volume="0.8"></audio>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        ["#l1", "#l2", "#l3"].forEach((s, i) => {
          tl.fromTo(s, { opacity: 0, x: -120, skewX: -8 }, { opacity: 1, x: 0, skewX: 0, duration: 0.5, ease: "power4.out" }, 0.3 + i * 0.8);
        });
        tl.fromTo("#l3", { scale: 1 }, { scale: 1.06, transformOrigin: "left center", duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.0);
        tl.fromTo("#sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.0);
        tl.fromTo("#tease .typing", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 4.0);
        tl.fromTo("#tease .d", { y: 0 }, { y: -14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 9, stagger: 0.12 }, 4.4);
        tl.fromTo("#t1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 5.0);
        tl.fromTo("#t2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 5.8);
        tl.fromTo("#vagas", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 6.8);
        tl.to({}, { duration: 9 }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
