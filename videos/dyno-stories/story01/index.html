<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-moda-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-moda-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFF6EA; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6EA; font-family: "Space Grotesk", sans-serif; color: #1B1F3B; }
      .bg { position: absolute; inset: 0; background: #FFF6EA; }
      .dots { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(27,31,59,.10) 2px, transparent 2.5px); background-size: 54px 54px; }
      .kicker { position: absolute; left: 96px; top: 260px; font-size: 34px; font-weight: 700; letter-spacing: 6px; color: #0E8A60; }
      .title { position: absolute; left: 96px; width: 888px; top: 330px; font-family: "Bodoni Moda", serif; font-weight: 700; font-size: 104px; line-height: 1.06; }
      .w { display: inline-block; }
      .sheet { position: absolute; left: 96px; top: 900px; width: 888px; height: 440px; display: grid; grid-template-columns: 290px repeat(3, 196px); grid-auto-rows: 86px; border: 5px solid #1B1F3B; border-radius: 24px; background: #FFFFFF; overflow: hidden; box-shadow: 12px 12px 0 rgba(27,31,59,.12); }
      .c { border-right: 2px solid #D9D2C4; border-bottom: 2px solid #D9D2C4; display: flex; align-items: center; padding: 0 22px; font-size: 38px; }
      .h { background: #1B1F3B; color: #FFF6EA; font-weight: 700; letter-spacing: 3px; font-size: 32px; justify-content: center; }
      .lab { font-weight: 700; }
      .num { justify-content: flex-end; }
      .cursor { width: 4px; height: 46px; background: #FF8A3D; }
      .pill { position: absolute; left: 96px; top: 830px; background: #FF8A3D; border: 4px solid #1B1F3B; border-radius: 28px; padding: 20px 36px; font-family: "Bodoni Moda", serif; font-weight: 700; font-style: italic; font-size: 92px; line-height: 1.05; max-width: 888px; }
      .foot { position: absolute; left: 96px; top: 1460px; display: flex; align-items: center; gap: 20px; }
      .typing { display: flex; gap: 10px; padding: 24px 30px; background: #1B1F3B; border-radius: 40px 40px 40px 8px; }
      .d { width: 16px; height: 16px; border-radius: 8px; background: #FFF6EA; }
      .foot-t { font-size: 32px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <div id="bg" class="clip bg" data-start="0" data-duration="7" data-track-index="0"><div class="dots"></div></div>
      <div id="kicker" class="clip kicker" data-start="0" data-duration="7" data-track-index="1">PERGUNTA SINCERA</div>
      <div id="title" data-layout-allow-overlap class="clip title" data-start="0" data-duration="7" data-track-index="2"><span data-layout-allow-overlap class="w">Quantas</span> <span data-layout-allow-overlap class="w">vezes</span> <span data-layout-allow-overlap class="w">você</span> <span data-layout-allow-overlap class="w">já</span> <span data-layout-allow-overlap class="w">começou</span> <span data-layout-allow-overlap class="w">uma</span> <span data-layout-allow-overlap class="w">planilha</span> <span data-layout-allow-overlap class="w">em</span> <span data-layout-allow-overlap class="w">janeiro…</span></div>
      <div id="sheet" class="clip sheet" data-start="0" data-duration="4.4" data-track-index="3">
        <div class="c h"></div><div class="c h">JAN</div><div class="c h">FEV</div><div class="c h">MAR</div>
        <div class="c lab">Mercado</div><div class="c num"><span class="v1">612</span></div><div class="c num"><span class="v2">580</span></div><div class="c"></div>
        <div class="c lab">Luz</div><div class="c num"><span class="v1">187</span></div><div class="c"><span class="cursor"></span></div><div class="c"></div>
        <div class="c lab">Gasolina</div><div class="c num"><span class="v1">290</span></div><div class="c"></div><div class="c"></div>
        <div class="c lab">Lazer</div><div class="c num"><span class="v1">150</span></div><div class="c"></div><div class="c"></div>
      </div>
      <div id="pill" class="clip pill" data-start="3.6" data-duration="3.4" data-track-index="4">…e largou em fevereiro?</div>
      <div id="foot" class="clip foot" data-start="0" data-duration="7" data-track-index="5">
        <div class="typing"><div class="d"></div><div class="d"></div><div class="d"></div></div>
        <div class="foot-t">algo está chegando</div>
      </div>
      <audio id="bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="7" data-track-index="6" data-volume="0.8"></audio>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
        tl.fromTo("#title .w", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, 0.3);
        tl.fromTo("#sheet", { opacity: 0, y: 80, rotation: 0 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 1.0);
        tl.fromTo("#sheet .v1", { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.18 }, 1.5);
        tl.fromTo("#sheet .v2", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 2.3);
        tl.fromTo("#sheet .cursor", { opacity: 0 }, { opacity: 1, duration: 0.05, repeat: 7, yoyo: true, ease: "steps(1)" }, 2.5);
        tl.to("#sheet", { opacity: 0.6, filter: "grayscale(1)", duration: 0.5, ease: "power1.out" }, 3.1);
        tl.to("#sheet", { y: 700, rotation: 9, opacity: 0, duration: 0.7, ease: "power2.in" }, 3.6);
        tl.fromTo("#pill", { opacity: 0, scale: 1.5, rotation: 4 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.45, ease: "back.out(2)" }, 3.75);
        tl.fromTo("#foot", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 4.6);
        tl.fromTo("#foot .d", { y: 0 }, { y: -10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.12 }, 5.0);
        tl.to({}, { duration: 7 }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
