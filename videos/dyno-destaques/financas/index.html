<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1B1F3B; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="el-01-financas" class="scene" data-composition-id="01-financas" data-composition-src="compositions/frames/01-financas.html" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="el-02-financas" class="scene" data-composition-id="02-financas" data-composition-src="compositions/frames/02-financas.html" data-start="4" data-duration="4.5" data-track-index="1"></div>
      <div id="el-03-financas" class="scene" data-composition-id="03-financas" data-composition-src="compositions/frames/03-financas.html" data-start="8" data-duration="5" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="13" data-track-index="11" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-financas", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-financas", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, 4);
        tl.to("#el-02-financas", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-03-financas", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.to({}, { duration: 13 }, 0);
      })();
    </script>
  </body>
</html>
