<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6EA; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <div id="el-01-caixa" class="scene" data-composition-id="01-caixa" data-composition-src="compositions/frames/01-caixa.html" data-start="0" data-duration="5" data-track-index="0"></div>
      <div id="el-02-paga" class="scene" data-composition-id="02-paga" data-composition-src="compositions/frames/02-paga.html" data-start="4.6" data-duration="4" data-track-index="1"></div>
      <div id="el-03-audio" class="scene" data-composition-id="03-audio" data-composition-src="compositions/frames/03-audio.html" data-start="8.2" data-duration="7" data-track-index="0"></div>
      <div id="el-04-pronto" class="scene" data-composition-id="04-pronto" data-composition-src="compositions/frames/04-pronto.html" data-start="14.8" data-duration="3.2" data-track-index="1"></div>
      <div id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="17.6" data-duration="4.4" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/dyno-bgm-22.wav" data-start="0" data-duration="22" data-track-index="11" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.fromTo("#el-02-paga", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 4.6);
        tl.to("#el-01-caixa", { x: -160, duration: 0.4, ease: "power3.inOut" }, 4.6);
        tl.fromTo("#el-03-audio", { clipPath: "circle(0% at 50% 60%)" }, { clipPath: "circle(80% at 50% 60%)", duration: 0.45, ease: "power3.inOut" }, 8.2);
        tl.fromTo("#el-04-pronto", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 14.8);
        tl.to("#el-03-audio", { y: -180, duration: 0.4, ease: "power3.inOut" }, 14.8);
        tl.fromTo("#el-05-cta", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 17.6);
        tl.to({}, { duration: 22 }, 0);
      })();
    </script>
  </body>
</html>
