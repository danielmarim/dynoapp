<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6EA; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1080" data-height="1920">
      <div id="el-01-gancho" class="scene" data-composition-id="01-gancho" data-composition-src="compositions/frames/01-gancho.html" data-start="0" data-duration="3.5" data-track-index="0"></div>
      <div id="el-02-anota" class="scene" data-composition-id="02-anota" data-composition-src="compositions/frames/02-anota.html" data-start="3" data-duration="5.5" data-track-index="1"></div>
      <div id="el-03-lembra" class="scene" data-composition-id="03-lembra" data-composition-src="compositions/frames/03-lembra.html" data-start="8" data-duration="4.5" data-track-index="0"></div>
      <div id="el-04-organiza" class="scene" data-composition-id="04-organiza" data-composition-src="compositions/frames/04-organiza.html" data-start="12" data-duration="3.5" data-track-index="1"></div>
      <div id="el-05-beta" class="scene" data-composition-id="05-beta" data-composition-src="compositions/frames/05-beta.html" data-start="15" data-duration="4.5" data-track-index="0"></div>
      <div id="el-06-chamada" class="scene" data-composition-id="06-chamada" data-composition-src="compositions/frames/06-chamada.html" data-start="19" data-duration="3.5" data-track-index="1"></div>
      <audio id="el-bgm" src="assets/audio/dyno-bgm-22.wav" data-start="0" data-duration="22.5" data-track-index="11" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-gancho", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3);
        tl.fromTo("#el-02-anota", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3);
        tl.fromTo("#el-03-lembra", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, 8);
        tl.to("#el-02-anota", { x: -160, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.to("#el-03-lembra", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-04-organiza", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-05-beta", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, 15);
        tl.to("#el-04-organiza", { y: -180, duration: 0.55, ease: "power3.inOut" }, 15);
        tl.to("#el-05-beta", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.fromTo("#el-06-chamada", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.to({}, { duration: 22.5 }, 0);
      })();
    </script>
  </body>
</html>
