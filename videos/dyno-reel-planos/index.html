<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #060A13; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.8" data-width="1080" data-height="1920">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="3.8" data-track-index="0"></div>
      <div id="el-02-quiz" class="scene" data-composition-id="02-quiz" data-composition-src="compositions/frames/02-quiz.html" data-start="3.5" data-duration="7.4" data-track-index="1"></div>
      <div id="el-03-planos" class="scene" data-composition-id="03-planos" data-composition-src="compositions/frames/03-planos.html" data-start="10.6" data-duration="7.6" data-track-index="0"></div>
      <div id="el-04-gratis" class="scene" data-composition-id="04-gratis" data-composition-src="compositions/frames/04-gratis.html" data-start="17.9" data-duration="3.8" data-track-index="1"></div>
      <div id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="21.4" data-duration="4.4" data-track-index="0"></div>
      <audio id="el-bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="25.8" data-track-index="11" data-volume="0.75"></audio>
      <audio id="el-sfx" src="assets/sfx/sfx-mix.wav" data-start="0" data-duration="25.8" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#el-02-quiz", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 3.5);
        tl.fromTo("#el-03-planos", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 10.6);
        tl.to("#el-02-quiz", { y: -180, duration: 0.4, ease: "power3.inOut" }, 10.6);
        tl.fromTo("#el-04-gratis", { clipPath: "circle(0% at 30% 40%)" }, { clipPath: "circle(90% at 30% 40%)", duration: 0.45, ease: "power3.inOut" }, 17.9);
        tl.fromTo("#el-05-cta", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 21.4);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
